# Test workflow for tvarr
# Runs tests with race detection - this is the blocking gate for all build workflows
# Lint, security, and verify checks remain in ci.yml as non-blocking informational checks

name: Test

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild FFmpeg even if today's image exists
        type: boolean
        default: false
      build_target:
        description: FFmpeg image target
        type: choice
        options:
          - runtime
          - full-build
        default: runtime
  schedule:
    - cron: 23 0 * * 0

# Cancel in-progress runs for the same branch
concurrency:
  group: test-and-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  GO_VERSION: "stable"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with race detector
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  changes:
    runs-on: ubuntu-latest
    outputs:
      ffmpeg: ${{ steps.changes.outputs.ffmpeg }}
      images: ${{ steps.changes.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BASE"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo 'ffmpeg=true' >> "$GITHUB_OUTPUT"
            echo 'images=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed-files"
          if grep -Eq '^deployment/docker/(Dockerfile.ffmpeg|pkgbuild/|scripts/)|^scripts/check-hwaccel.sh$|^\.github/workflows/(docker-ffmpeg|test)\.yml$' "$RUNNER_TEMP/changed-files"; then
            echo 'ffmpeg=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ffmpeg=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -Ev '(^docs/|^specs/|\.md$)' "$RUNNER_TEMP/changed-files" >/dev/null; then
            echo 'images=true' >> "$GITHUB_OUTPUT"
          else
            echo 'images=false' >> "$GITHUB_OUTPUT"
          fi
  ffmpeg:
    needs:
      - test
      - changes
    if: needs.changes.outputs.ffmpeg == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-ffmpeg.yml
    with:
      force_rebuild: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.force_rebuild || false }}
      build_target: ${{ inputs.build_target || 'runtime' }}
  image-tvarr:
    needs:
      - test
      - changes
      - ffmpeg
    if: always() && github.event_name != 'schedule' && needs.test.result == 'success' && needs.changes.result == 'success' &&
      needs.changes.outputs.images == 'true' && (needs.ffmpeg.result == 'success' || needs.ffmpeg.result == 'skipped')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-tvarr.yml
  image-transcoder:
    needs:
      - test
      - changes
      - ffmpeg
    if: always() && github.event_name != 'schedule' && needs.test.result == 'success' && needs.changes.result == 'success' &&
      needs.changes.outputs.images == 'true' && (needs.ffmpeg.result == 'success' || needs.ffmpeg.result == 'skipped')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-transcoder.yml
  image-coordinator:
    needs:
      - test
      - changes
      - ffmpeg
    if: always() && github.event_name != 'schedule' && needs.test.result == 'success' && needs.changes.result == 'success' &&
      needs.changes.outputs.images == 'true' && (needs.ffmpeg.result == 'success' || needs.ffmpeg.result == 'skipped')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-coordinator.yml
