# Build tvarr Docker Image
# Called by Test after the exact revision passes tests.
# Dependencies are managed by the calling workflow.

name: Build tvarr Docker Image

on:
  # Trigger after Test workflow completes (for push to main or tags)
  workflow_call: {}
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FFMPEG_IMAGE: ghcr.io/${{ github.repository_owner }}/tvarr-ffmpeg

jobs:
  # Gate: only proceed if tests passed
  gate:
    name: Verify Tests Passed
    runs-on: ubuntu-latest
    # The caller requires successful tests before invoking this workflow.
    # For PRs/workflow_dispatch: always proceed (tests checked via status checks)
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve commit and ref
        id: resolve
        run: |
          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "ref=$BUILD_REF" >> "$GITHUB_OUTPUT"

  # Wait for FFmpeg workflow to complete (if running) before building
        env:
          COMMIT_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
  build:
    # Note: ARM64 not supported - FFmpeg base image (Arch Linux) is amd64 only
    # TODO: Add ARM64 support when FFmpeg base supports it
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha || github.sha }}
          fetch-depth: 0  # Full history for version detection
          fetch-tags: true  # Explicitly fetch tags for version detection

      - name: Install Task
        uses: go-task/setup-task@v1
        with:
          version: 3.x

      - name: Debug version info
        run: |
          echo "Git tags:"
          git tag -l | tail -10
          echo "Git describe (exact):"
          git describe --tags --exact-match 2>/dev/null || echo "(no exact tag)"
          echo "Git describe (long):"
          git describe --tags --always --long
          echo "Task version:"
          task version:show 2>/dev/null || echo "(task version:show not available)"

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tvarr image
        run: task container:build:tvarr TAG=${{ matrix.arch }} FFMPEG_IMAGE=${{ env.FFMPEG_IMAGE }}:${{ matrix.arch }}
        env:
          CONTAINER_RUNTIME: docker

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.arch }}

  manifest:
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'pull_request' && needs.build.result == 'success'
    needs: [gate, build]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version info
        id: version
        run: |
          # Use git describe to detect if this commit is a release tag
          # This works regardless of trigger type (workflow_run, push, etc.)
          if git describe --tags --exact-match 2>/dev/null | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            VERSION=$(git describe --tags --exact-match | sed 's/^v//')
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      # Note: Currently amd64 only - ARM64 support pending FFmpeg base image

      # Guarded on main: :latest is what deployments track, so publishing it from
      # a feature branch puts unreviewed code into production. The preview step
      # below already had this condition; this one did not, so any non-PR run of
      # this job -- a workflow_dispatch on a branch, for instance -- could
      # overwrite :latest.
      - name: Create and push manifest (latest)
        if: needs.gate.outputs.ref == 'main' || needs.gate.outputs.ref == 'refs/heads/main'
        run: |
          docker manifest rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>/dev/null || true
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:amd64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Create and push preview manifest (main branch)
        if: needs.gate.outputs.ref == 'main' || needs.gate.outputs.ref == 'refs/heads/main'
        run: |
          docker manifest rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:preview 2>/dev/null || true
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:preview \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:amd64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:preview

      - name: Create and push version manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          docker manifest rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} 2>/dev/null || true
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:amd64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}

      - name: Create and push release manifest (releases only)
        if: steps.version.outputs.is_release == 'true'
        run: |
          docker manifest rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:release 2>/dev/null || true
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:release \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:amd64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:release

      - name: Create and push semver manifests (releases only)
        if: steps.version.outputs.is_release == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f1-2)

          # Major version tag (e.g., 1)
          docker manifest rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${MAJOR} 2>/dev/null || true
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${MAJOR} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:amd64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${MAJOR}

          # Minor version tag (e.g., 1.2)
          docker manifest rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${MINOR} 2>/dev/null || true
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${MINOR} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:amd64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${MINOR}

      - name: Inspect manifest
        run: docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
